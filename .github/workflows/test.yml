name: test

# Backend tests, migrations and Terraform checks. Runs on every push and PR; on de and
# main it runs as the first job of deploy.yml instead (workflow_call), so never twice.
on:
  push:
    branches-ignore: [de, main]
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buraco
          POSTGRES_PASSWORD: buraco
          POSTGRES_DB: buraco
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U buraco" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://buraco:buraco@localhost:5434/buraco
      # Tests rebuild their own schema, so they get a separate database from the migration check.
      TEST_DATABASE_URL: postgresql+asyncpg://buraco:buraco@localhost:5434/buraco_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Create the test database
        run: PGPASSWORD=buraco psql -h localhost -p 5434 -U buraco -c "CREATE DATABASE buraco_test"
      - run: uv run pytest -q
      - name: Migrations apply to an empty database
        run: uv run alembic upgrade head
      - name: Models and migrations agree
        run: uv run alembic check
      - name: Migrations undo and redo cleanly
        run: uv run alembic downgrade base && uv run alembic upgrade head
      - name: Docker image builds
        run: docker build -t buraco-backend .

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform is formatted
        run: terraform fmt -recursive -check
      - name: Terraform is valid (no Azure access needed)
        run: terraform init -backend=false -input=false && terraform validate
