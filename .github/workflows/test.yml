name: test

# Runs the backend test suite on every push and PR. The deploy workflow
# (Terraform + Docker, as in Woddie/Salvie) is added with the API in a later phase.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
